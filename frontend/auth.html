<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Inicie sessão ou crie a sua conta EZNY para comprar e vender em Angola.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0e7490">
<link rel="canonical" href="https://ezny.vercel.app/auth.html">
<title>EZNY - Entrar</title>
<link rel="icon" type="image/png" href="assets/ezny-logo-transparent.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/ezny-brand.css">
  <link rel="stylesheet" href="assets/css/phosphor.css">


<body>

<!-- Orbs de fundo -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<div class="app-container">
<img class="ezny-brand-lockup" src="assets/ezny-logo-transparent.png" alt="EZNY — Compre. Venda. Conecte-se.">


  <div class="tabs">
    <button class="active" data-csp-handler="2c9ac12a82b515d8">Entrar</button>
    <button data-csp-handler="6b496a086e5129bf">Criar Conta</button>
  </div>

  <div class="tab-content">

    <!-- ═════════════════ LOGIN ═════════════════ -->
    <div id="login" class="active">
      <div class="auth-header">
<div class="login-avatar">
<i class="ph-light ph-user-circle"></i>
</div>        
        <h2>Bem-vindo de volta</h2>
        <p>Inicie sessão na sua conta</p>
      </div>

      <div id="msgErroLogin" class="msg erro">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </div>
      <div id="msgBanLogin" class="msg ban">
        <i class="ph ph-shield-warning"></i>
        <span><strong>Conta Suspensa</strong><span class="detalhe"></span></span>
      </div>

      <div class="input-group">
        <label>Telefone</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-phone"></i></span>
          <input id="telefone" placeholder="Ex: 923456789" inputmode="tel" autocomplete="tel">
        </div>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-lock-key"></i></span>
          <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-password" data-csp-handler="e5bbdf95f02f2ca7" aria-label="Mostrar senha">
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
      </div>

      <button class="submit" id="btnLogin" data-csp-handler="4361ddd74a6d4b71">
        <span>Entrar</span>
      </button>
            <p class="termos-link">
        Contacte o <a href="reportar-auth.html">Suporte</a> para comunicar um problema
      </p>

    </div>

    <!-- ═════════════════ CADASTRO ═════════════════ -->
    <div id="cadastro">
      <div class="auth-header">
<div class="user-circle-plus-avatar">
<i class="ph-light ph-user-circle-plus"></i>
</div>
        <h2>Criar conta</h2>
        <p>Registe-se gratuitamente na EZNY</p>
      </div>

      <div id="msgErroCadastro" class="msg erro">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </div>
      <div id="msgBanCadastro" class="msg ban">
        <i class="ph ph-shield-warning"></i>
        <span><strong>Conta Suspensa</strong><span class="detalhe"></span></span>
      </div>
      <div id="msgSucessoCadastro" class="msg sucesso">
        <i class="ph ph-check-circle"></i>
        <span></span>
      </div>

      <div class="input-group">
        <label>Nome completo</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-user"></i></span>
          <input id="nome" placeholder="Seu nome completo" autocomplete="name">
        </div>
      </div>

      <div class="input-group">
        <label>Email <span style="font-weight:400;opacity:.65;">(opcional)</span></label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-envelope"></i></span>
          <input id="emailCadastro" type="email" placeholder="seu@gmail.com" autocomplete="email">
        </div>
      </div>

      <div class="input-group">
        <label>Telefone</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-phone"></i></span>
          <input id="telefoneCadastro" placeholder="Ex: 923456789" inputmode="tel" autocomplete="tel">
        </div>
      </div>

      <div class="input-group">
        <label>Data de nascimento</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-calendar-blank"></i></span>
          <input type="date" id="data_nascimento" required autocomplete="bday">
        </div>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-lock-key"></i></span>
          <input id="senhaCadastro" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" data-csp-handler="075f32c5c59296fd">
          <button type="button" class="toggle-password" data-csp-handler="a01670254aa83ddb" aria-label="Mostrar senha">
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
        <div class="strength-bar" id="strengthBar">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      <div class="input-group">
        <label>Confirmar senha</label>
        <div class="input-container">
          <span class="input-icon"><i class="ph ph-lock-key-open"></i></span>
          <input id="senhaConfirmar" type="password" placeholder="Repita a senha" autocomplete="new-password" data-csp-handler="9481b05e043f9397">
          <button type="button" class="toggle-password" data-csp-handler="d2d5af0e08ab1993" aria-label="Mostrar senha">
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
      </div>

      <button class="submit" id="btnCadastro" data-csp-handler="8f75b950f434cdf8">
        <span>Criar Conta</span>
      </button>


<div class="aceitacao-termos">
  <input
    type="checkbox"
    id="aceitarTermos"
    name="aceitarTermos"
    required
    aria-describedby="textoAceitacaoTermos"
  >

  <label for="aceitarTermos" id="textoAceitacaoTermos">
    Li e aceito os
    <a href="termos-auth.html" >Termos de Uso</a>
    e a
    <a href="politica-auth.html">Política de Privacidade</a>.
  </label>
</div>

</div>

  </div>
</div>

<script src="2g5EVYGubuyFBjbv8N8T78BBXSG674R0JS4Fbd7f8u45ubff3h634gedbg f4h3tfg7f83ecue87/media.js"></script>
<script src="2g5EVYGubuyFBjbv8N8T78BBXSG674R0JS4Fbd7f8u45ubff3h634gedbg f4h3tfg7f83ecue87/auth.js"></script>

<script src="csp-handlers.js"></script>
</body>
</html>
