<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Header -->
<div class="notif-header">
  <button class="notif-header-btn" data-csp-handler="8265d34da54231ff">
    <i class="ph ph-arrow-left"></i>
  </button>
  <div class="notif-header-titulo">Notificações</div>
  <div class="notif-header-acoes">
    <button class="notif-header-acao" data-csp-handler="55f6854d631925b9">
      <i class="ph ph-checks"></i> Tudo lido
    </button>
    <button class="notif-header-acao" data-csp-handler="0424588372247a33">
      <i class="ph ph-trash"></i> Limpar
    </button>
  </div>
</div>

<!-- Loading -->
<div id="notifLoading" class="notif-loading">
  <i class="ph ph-spinner animate-spin"></i>
  <p>A carregar notificações...</p>
</div>

<!-- Lista -->
<div id="notifLista" class="notif-lista" style="display:none;"></div>

<!-- Vazio -->
<div id="notifVazio" class="notif-vazio" style="display:none;">
  <i class="ph ph-bell-slash"></i>
  <h3>Sem notificações</h3>
  <p>Quando os teus anúncios forem aprovados, rejeitados, ou receberes mensagens, verás aqui.</p>
